<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Pod boundary (dashed box) -->
  <rect x="50" y="50" width="700" height="300"
        fill="none" stroke="#326CE5" stroke-width="4"
        stroke-dasharray="10,5" rx="15"/>

  <!-- Pod label -->
  <text x="400" y="35" font-family="Arial, sans-serif"
        font-size="28" font-weight="bold" fill="#326CE5"
        text-anchor="middle">Pod</text>

  <!-- Container box inside Pod -->
  <rect x="150" y="100" width="500" height="200"
        fill="#667eea" stroke="#326CE5" stroke-width="3" rx="10"/>

  <!-- Container label -->
  <text x="400" y="140" font-family="Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#ffffff"
        text-anchor="middle">Container</text>

  <!-- Application icon/text -->
  <text x="400" y="180" font-family="Arial, sans-serif"
        font-size="48" fill="#ffffff" text-anchor="middle">🐍</text>

  <!-- App name -->
  <text x="400" y="230" font-family="Arial, sans-serif"
        font-size="20" fill="#ffffff" text-anchor="middle">hello-python:latest</text>

  <!-- Port indicator -->
  <circle cx="630" cy="200" r="30" fill="#764ba2" stroke="#ffffff" stroke-width="3"/>
  <text x="630" y="210" font-family="Arial, sans-serif"
        font-size="18" font-weight="bold" fill="#ffffff"
        text-anchor="middle">:8080</text>

  <!-- Pod IP address -->
  <rect x="150" y="270" width="200" height="30"
        fill="rgba(255,255,255,0.2)" rx="5"/>
  <text x="250" y="292" font-family="Arial, sans-serif"
        font-size="16" fill="#ffffff" text-anchor="middle">IP: 10.1.0.42</text>

  <!-- Shared network/storage indicator -->
  <rect x="450" y="270" width="200" height="30"
        fill="rgba(255,255,255,0.2)" rx="5"/>
  <text x="550" y="292" font-family="Arial, sans-serif"
        font-size="16" fill="#ffffff" text-anchor="middle">Shared Network</text>

  <!-- Side annotations -->
  <text x="780" y="130" font-family="Arial, sans-serif"
        font-size="16" fill="#666666" text-anchor="end">Single IP</text>
  <text x="780" y="160" font-family="Arial, sans-serif"
        font-size="16" fill="#666666" text-anchor="end">Shared Storage</text>
  <text x="780" y="190" font-family="Arial, sans-serif"
        font-size="16" fill="#666666" text-anchor="end">Ephemeral</text>
</svg>