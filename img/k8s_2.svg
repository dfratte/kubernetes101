<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Deployment: Managing Pods
  </text>

  <!-- Deployment Controller -->
  <g id="deployment">
    <rect x="300" y="80" width="400" height="120" fill="#ffffff" stroke="#00B67A" stroke-width="4" rx="10"/>

    <text x="500" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#00B67A">
      📋 Deployment
    </text>
    <text x="500" y="135" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#34495e">
      nginx-deployment
    </text>

    <!-- Deployment config -->
    <rect x="320" y="150" width="360" height="35" fill="#e8f5e9" stroke="#00B67A" stroke-width="1" rx="5"/>
    <text x="370" y="172" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#00905F">
      • Desired replicas: 3
    </text>
    <text x="540" y="172" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#00905F">
      • Image: nginx:latest
    </text>
  </g>

  <!-- Arrow to ReplicaSet -->
  <g id="manages-arrow">
    <path d="M 500 200 L 500 230" stroke="#00B67A" stroke-width="3" fill="none"/>
    <polygon points="500,230 495,220 505,220" fill="#00B67A"/>
    <text x="520" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#00905F">
      manages
    </text>
  </g>

  <!-- ReplicaSet -->
  <g id="replicaset">
    <rect x="320" y="235" width="360" height="60" fill="#ffffff" stroke="#3498db" stroke-width="3" rx="8"/>
    <text x="500" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#3498db">
      🔄 ReplicaSet
    </text>
    <text x="500" y="283" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">
      Ensures 3 pod replicas are running
    </text>
  </g>

  <!-- Arrows to Pods -->
  <g id="pod-arrows">
    <path d="M 380 295 L 250 350" stroke="#3498db" stroke-width="2" fill="none"/>
    <polygon points="250,350 258,343 255,353" fill="#3498db"/>

    <path d="M 500 295 L 500 350" stroke="#3498db" stroke-width="2" fill="none"/>
    <polygon points="500,350 495,340 505,340" fill="#3498db"/>

    <path d="M 620 295 L 750 350" stroke="#3498db" stroke-width="2" fill="none"/>
    <polygon points="750,350 742,343 745,353" fill="#3498db"/>

    <text x="500" y="328" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#3498db">
      creates &amp; monitors
    </text>
  </g>

  <!-- Pod 1 -->
  <g id="pod1">
    <rect x="80" y="355" width="190" height="150" fill="#ffffff" stroke="#00B67A" stroke-width="3" rx="8"/>
    <text x="175" y="380" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#00B67A">
      Pod 1
    </text>
    <text x="175" y="398" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      nginx-deployment-abc123
    </text>

    <!-- Container inside pod -->
    <rect x="95" y="410" width="160" height="80" fill="#e8f5e9" stroke="#00905F" stroke-width="2" rx="5"/>
    <text x="175" y="432" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#00905F">
      nginx container
    </text>
    <text x="175" y="465" font-family="Arial, sans-serif" font-size="32" text-anchor="middle">
      🐳
    </text>

    <!-- Status -->
    <text x="175" y="498" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#00B67A">
      ✓ Running
    </text>
  </g>

  <!-- Pod 2 -->
  <g id="pod2">
    <rect x="405" y="355" width="190" height="150" fill="#ffffff" stroke="#00B67A" stroke-width="3" rx="8"/>
    <text x="500" y="380" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#00B67A">
      Pod 2
    </text>
    <text x="500" y="398" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      nginx-deployment-def456
    </text>

    <!-- Container inside pod -->
    <rect x="420" y="410" width="160" height="80" fill="#e8f5e9" stroke="#00905F" stroke-width="2" rx="5"/>
    <text x="500" y="432" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#00905F">
      nginx container
    </text>
    <text x="500" y="465" font-family="Arial, sans-serif" font-size="32" text-anchor="middle">
      🐳
    </text>

    <!-- Status -->
    <text x="500" y="498" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#00B67A">
      ✓ Running
    </text>
  </g>

  <!-- Pod 3 -->
  <g id="pod3">
    <rect x="730" y="355" width="190" height="150" fill="#ffffff" stroke="#00B67A" stroke-width="3" rx="8"/>
    <text x="825" y="380" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#00B67A">
      Pod 3
    </text>
    <text x="825" y="398" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      nginx-deployment-ghi789
    </text>

    <!-- Container inside pod -->
    <rect x="745" y="410" width="160" height="80" fill="#e8f5e9" stroke="#00905F" stroke-width="2" rx="5"/>
    <text x="825" y="432" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#00905F">
      nginx container
    </text>
    <text x="825" y="465" font-family="Arial, sans-serif" font-size="32" text-anchor="middle">
      🐳
    </text>

    <!-- Status -->
    <text x="825" y="498" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#00B67A">
      ✓ Running
    </text>
  </g>

  <!-- Self-Healing Scenario -->
  <g id="self-healing">
    <!-- Crashed Pod (dashed) -->
    <rect x="405" y="540" width="190" height="40" fill="#ffebee" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" rx="8"/>
    <text x="500" y="565" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#e74c3c">
      ❌ Pod crashes...
    </text>

    <!-- Arrow showing replacement -->
    <path d="M 500 580 L 500 600 Q 500 610 510 610 L 750 610 Q 760 610 760 600 L 760 510" stroke="#00B67A" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
    <polygon points="760,510 755,520 765,520" fill="#00B67A"/>

    <text x="630" y="625" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#00B67A">
      🔄 Auto-creates replacement
    </text>
  </g>

  <!-- Benefits Box -->
  <rect x="50" y="620" width="900" height="65" fill="#ffffff" stroke="#00B67A" stroke-width="2" rx="8"/>
  <text x="500" y="645" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#00B67A">
    Deployment Benefits
  </text>
  <text x="500" y="668" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#34495e">
    ✓ Self-Healing (auto-restart)    ✓ Easy Scaling (1→100)    ✓ Rolling Updates    ✓ Rollback    ✓ Declarative Config
  </text>
</svg>
