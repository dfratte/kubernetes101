<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Running a Container
  </text>

  <!-- Main Container Box -->
  <g id="main-flow">
    <!-- Container Image (Blueprint) -->
    <g id="image">
      <rect x="50" y="100" width="200" height="280" fill="#ffffff" stroke="#3498db" stroke-width="3" rx="10"/>
      <text x="150" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#3498db">
        Container Image
      </text>
      <text x="150" y="155" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">
        (Blueprint/Template)
      </text>

      <!-- Image layers -->
      <rect x="70" y="180" width="160" height="40" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" rx="3"/>
      <text x="150" y="205" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#34495e">
        nginx:latest
      </text>

      <rect x="70" y="230" width="160" height="35" fill="#e8f5e9" stroke="#00B67A" stroke-width="1" rx="3"/>
      <text x="150" y="252" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#00905F">
        Application Code
      </text>

      <rect x="70" y="275" width="160" height="35" fill="#e3f2fd" stroke="#3498db" stroke-width="1" rx="3"/>
      <text x="150" y="297" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2980b9">
        Dependencies
      </text>

      <rect x="70" y="320" width="160" height="35" fill="#fce4ec" stroke="#e74c3c" stroke-width="1" rx="3"/>
      <text x="150" y="342" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#c0392b">
        Configuration
      </text>

      <text x="150" y="375" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">
        📦
      </text>
    </g>

    <!-- Arrow with "docker run" -->
    <g id="run-arrow">
      <path d="M 260 240 L 310 240" stroke="#00B67A" stroke-width="4" fill="none"/>
      <polygon points="310,240 295,233 295,247" fill="#00B67A"/>

      <rect x="245" y="205" width="90" height="25" fill="#00B67A" rx="5"/>
      <text x="290" y="222" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">
        docker run
      </text>
    </g>

    <!-- Running Container -->
    <g id="container">
      <rect x="320" y="100" width="230" height="280" fill="#ffffff" stroke="#00B67A" stroke-width="3" rx="10"/>
      <text x="435" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#00B67A">
        Running Container
      </text>
      <text x="435" y="155" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">
        (Live Instance)
      </text>

      <!-- Container internals -->
      <rect x="340" y="180" width="190" height="170" fill="#e8f5e9" stroke="#00905F" stroke-width="2" rx="5"/>

      <text x="435" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00905F">
        Nginx Web Server
      </text>
      <text x="435" y="225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">
        Running on Port 80
      </text>

      <text x="435" y="275" font-family="Arial, sans-serif" font-size="48" text-anchor="middle">
        🐳
      </text>

      <rect x="350" y="310" width="170" height="30" fill="#ffffff" stroke="#00B67A" stroke-width="1" rx="3"/>
      <text x="435" y="332" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#00905F">
        ✓ Isolated Process
      </text>

      <text x="435" y="370" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
        Container ID: c838b80e0ea2
      </text>
    </g>

    <!-- Network/Port Mapping -->
    <g id="network">
      <rect x="560" y="100" width="200" height="280" fill="#ffffff" stroke="#e74c3c" stroke-width="3" rx="10"/>
      <text x="660" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#e74c3c">
        Access
      </text>
      <text x="660" y="155" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">
        (From Your Machine)
      </text>

      <!-- Port mapping diagram -->
      <rect x="580" y="190" width="160" height="50" fill="#fff3e0" stroke="#f39c12" stroke-width="2" rx="5"/>
      <text x="660" y="212" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#e67e22">
        localhost:8080
      </text>
      <text x="660" y="230" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
        (Your Computer)
      </text>

      <!-- Mapping arrow -->
      <path d="M 660 245 L 660 265" stroke="#00B67A" stroke-width="3" fill="none"/>
      <polygon points="660,265 655,255 665,255" fill="#00B67A"/>
      <text x="615" y="258" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#00905F">
        -p 8080:80
      </text>

      <rect x="580" y="270" width="160" height="50" fill="#e8f5e9" stroke="#00B67A" stroke-width="2" rx="5"/>
      <text x="660" y="292" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#00905F">
        Container:80
      </text>
      <text x="660" y="310" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7f8c8d">
        (Inside Container)
      </text>

      <!-- Browser -->
      <text x="660" y="355" font-family="Arial, sans-serif" font-size="32" text-anchor="middle">
        🌐
      </text>
      <text x="660" y="375" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495e">
        Open browser to
      </text>
    </g>
  </g>

  <!-- Bottom explanation -->
  <rect x="50" y="400" width="700" height="80" fill="#ffffff" stroke="#00B67A" stroke-width="2" rx="8"/>
  <text x="400" y="425" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00B67A">
    What Just Happened?
  </text>
  <text x="400" y="447" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">
    1. Started container from image    2. Nginx running in isolation    3. Port 8080 → Container port 80
  </text>
  <text x="400" y="467" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">
    Access at http://localhost:8080 to see your custom welcome page! 👋
  </text>
</svg>
