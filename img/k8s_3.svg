<svg width="1000" height="650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="650" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Service: Stable Networking &amp; Load Balancing
  </text>

  <!-- Users/Traffic -->
  <g id="users">
    <text x="500" y="85" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#7f8c8d">
      Users / Traffic
    </text>

    <!-- User icons -->
    <text x="380" y="120" font-family="Arial, sans-serif" font-size="32" text-anchor="middle">
      👤
    </text>
    <text x="460" y="120" font-family="Arial, sans-serif" font-size="32" text-anchor="middle">
      👤
    </text>
    <text x="540" y="120" font-family="Arial, sans-serif" font-size="32" text-anchor="middle">
      👤
    </text>
    <text x="620" y="120" font-family="Arial, sans-serif" font-size="32" text-anchor="middle">
      👤
    </text>

    <!-- Arrows down -->
    <path d="M 380 125 L 380 160" stroke="#7f8c8d" stroke-width="2" fill="none"/>
    <path d="M 460 125 L 460 160" stroke="#7f8c8d" stroke-width="2" fill="none"/>
    <path d="M 540 125 L 540 160" stroke="#7f8c8d" stroke-width="2" fill="none"/>
    <path d="M 620 125 L 620 160" stroke="#7f8c8d" stroke-width="2" fill="none"/>
  </g>

  <!-- Service -->
  <g id="service">
    <rect x="250" y="165" width="500" height="100" fill="#ffffff" stroke="#00B67A" stroke-width="4" rx="10"/>

    <text x="500" y="195" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#00B67A">
      🌐 Service (nginx-service)
    </text>

    <!-- Service details -->
    <rect x="270" y="210" width="460" height="45" fill="#e8f5e9" stroke="#00B67A" stroke-width="2" rx="5"/>
    <text x="500" y="230" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#00905F">
      Stable IP: 10.43.x.x  |  DNS: nginx-service.default.svc.cluster.local
    </text>
    <text x="500" y="248" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">
      Selector: app=nginx  |  Port: 80  |  ⚖️ Load Balances across all matching pods
    </text>
  </g>

  <!-- Load Balancing Arrows -->
  <g id="lb-arrows">
    <path d="M 350 265 L 175 355" stroke="#00B67A" stroke-width="3" fill="none"/>
    <polygon points="175,355 183,348 180,358" fill="#00B67A"/>
    <text x="250" y="310" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#00905F">
      Request 1
    </text>

    <path d="M 500 265 L 500 355" stroke="#00B67A" stroke-width="3" fill="none"/>
    <polygon points="500,355 495,345 505,345" fill="#00B67A"/>
    <text x="520" y="310" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#00905F">
      Request 2
    </text>

    <path d="M 650 265 L 825 355" stroke="#00B67A" stroke-width="3" fill="none"/>
    <polygon points="825,355 817,348 820,358" fill="#00B67A"/>
    <text x="750" y="310" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#00905F">
      Request 3
    </text>
  </g>

  <!-- Pod 1 -->
  <g id="pod1">
    <rect x="50" y="360" width="250" height="170" fill="#ffffff" stroke="#3498db" stroke-width="3" rx="8"/>
    <text x="175" y="385" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#3498db">
      Pod 1 🐳
    </text>
    <text x="175" y="403" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      nginx-deployment-abc123
    </text>

    <!-- Pod details -->
    <rect x="70" y="415" width="210" height="100" fill="#e3f2fd" stroke="#2980b9" stroke-width="1" rx="5"/>
    <text x="175" y="435" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2980b9">
      IP: 10.1.1.5
    </text>
    <text x="175" y="455" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2980b9">
      Port: 80
    </text>
    <text x="175" y="475" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2980b9">
      Label: app=nginx
    </text>
    <text x="175" y="500" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#00B67A">
      ✓ Running
    </text>
  </g>

  <!-- Pod 2 -->
  <g id="pod2">
    <rect x="375" y="360" width="250" height="170" fill="#ffffff" stroke="#3498db" stroke-width="3" rx="8"/>
    <text x="500" y="385" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#3498db">
      Pod 2 🐳
    </text>
    <text x="500" y="403" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      nginx-deployment-def456
    </text>

    <!-- Pod details -->
    <rect x="395" y="415" width="210" height="100" fill="#e3f2fd" stroke="#2980b9" stroke-width="1" rx="5"/>
    <text x="500" y="435" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2980b9">
      IP: 10.1.1.8
    </text>
    <text x="500" y="455" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2980b9">
      Port: 80
    </text>
    <text x="500" y="475" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2980b9">
      Label: app=nginx
    </text>
    <text x="500" y="500" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#00B67A">
      ✓ Running
    </text>
  </g>

  <!-- Pod 3 -->
  <g id="pod3">
    <rect x="700" y="360" width="250" height="170" fill="#ffffff" stroke="#3498db" stroke-width="3" rx="8"/>
    <text x="825" y="385" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#3498db">
      Pod 3 🐳
    </text>
    <text x="825" y="403" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7f8c8d">
      nginx-deployment-ghi789
    </text>

    <!-- Pod details -->
    <rect x="720" y="415" width="210" height="100" fill="#e3f2fd" stroke="#2980b9" stroke-width="1" rx="5"/>
    <text x="825" y="435" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2980b9">
      IP: 10.1.1.12
    </text>
    <text x="825" y="455" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2980b9">
      Port: 80
    </text>
    <text x="825" y="475" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2980b9">
      Label: app=nginx
    </text>
    <text x="825" y="500" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#00B67A">
      ✓ Running
    </text>
  </g>

  <!-- Problem Scenario -->
  <g id="problem-scenario">
    <rect x="50" y="550" width="450" height="80" fill="#ffebee" stroke="#e74c3c" stroke-width="2" rx="8"/>
    <text x="275" y="573" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">
      ❓ Problem Without Service
    </text>
    <text x="275" y="593" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">
      Pod IPs are dynamic (10.1.1.5, 10.1.1.8, 10.1.1.12)
    </text>
    <text x="275" y="611" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#34495e">
      IPs change when pods restart - How do users connect?
    </text>
  </g>

  <!-- Solution -->
  <g id="solution">
    <rect x="520" y="550" width="430" height="80" fill="#e8f5e9" stroke="#00B67A" stroke-width="3" rx="8"/>
    <text x="735" y="573" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00B67A">
      ✅ Solution: Service
    </text>
    <text x="735" y="593" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#00905F">
      1️⃣ Provides stable IP &amp; DNS name
    </text>
    <text x="735" y="611" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#00905F">
      2️⃣ Automatically load balances to healthy pods
    </text>
  </g>
</svg>
