<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="600" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    What is a Container?
  </text>

  <!-- Left Side: Traditional Deployment -->
  <g id="traditional">
    <!-- Panel -->
    <rect x="40" y="80" width="420" height="480" fill="#ffffff" stroke="#95a5a6" stroke-width="2" rx="10"/>

    <!-- Title -->
    <text x="250" y="115" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#7f8c8d">
      Traditional / VM Approach
    </text>

    <!-- Hardware -->
    <rect x="80" y="470" width="340" height="60" fill="#34495e" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="250" y="505" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">
      Physical Server / Hardware
    </text>

    <!-- Host OS -->
    <rect x="80" y="400" width="340" height="60" fill="#7f8c8d" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="250" y="435" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">
      Host Operating System
    </text>

    <!-- Hypervisor -->
    <rect x="80" y="340" width="340" height="50" fill="#95a5a6" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="250" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">
      Hypervisor (VMware, VirtualBox)
    </text>

    <!-- VM 1 -->
    <g id="vm1">
      <rect x="90" y="150" width="150" height="180" fill="#ecf0f1" stroke="#e74c3c" stroke-width="2" rx="5"/>
      <rect x="100" y="295" width="130" height="25" fill="#e74c3c" stroke="#c0392b" stroke-width="1" rx="3"/>
      <text x="165" y="312" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">
        Guest OS
      </text>
      <rect x="100" y="260" width="130" height="25" fill="#3498db" stroke="#2980b9" stroke-width="1" rx="3"/>
      <text x="165" y="277" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ffffff">
        Libraries
      </text>
      <rect x="100" y="170" width="130" height="80" fill="#00B67A" stroke="#00905F" stroke-width="2" rx="3"/>
      <text x="165" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">
        App A
      </text>
      <text x="165" y="225" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">
        📦
      </text>
    </g>

    <!-- VM 2 -->
    <g id="vm2">
      <rect x="260" y="150" width="150" height="180" fill="#ecf0f1" stroke="#e74c3c" stroke-width="2" rx="5"/>
      <rect x="270" y="295" width="130" height="25" fill="#e74c3c" stroke="#c0392b" stroke-width="1" rx="3"/>
      <text x="335" y="312" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">
        Guest OS
      </text>
      <rect x="270" y="260" width="130" height="25" fill="#3498db" stroke="#2980b9" stroke-width="1" rx="3"/>
      <text x="335" y="277" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ffffff">
        Libraries
      </text>
      <rect x="270" y="170" width="130" height="80" fill="#00B67A" stroke="#00905F" stroke-width="2" rx="3"/>
      <text x="335" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">
        App B
      </text>
      <text x="335" y="225" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">
        📦
      </text>
    </g>

    <!-- Issues -->
    <text x="250" y="555" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#e74c3c">
      ❌ Heavy (GB per VM) • Slow startup • Resource intensive
    </text>
  </g>

  <!-- Arrow -->
  <g id="arrow">
    <path d="M 475 320 L 515 320" stroke="#00B67A" stroke-width="4" fill="none"/>
    <polygon points="515,320 500,313 500,327" fill="#00B67A"/>
    <text x="495" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#00B67A">
      vs
    </text>
  </g>

  <!-- Right Side: Container Deployment -->
  <g id="containers">
    <!-- Panel -->
    <rect x="540" y="80" width="420" height="480" fill="#ffffff" stroke="#00B67A" stroke-width="3" rx="10"/>

    <!-- Title -->
    <text x="750" y="115" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#00B67A">
      Container Approach
    </text>

    <!-- Hardware -->
    <rect x="580" y="470" width="340" height="60" fill="#34495e" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="750" y="505" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">
      Physical Server / Hardware
    </text>

    <!-- Host OS -->
    <rect x="580" y="400" width="340" height="60" fill="#7f8c8d" stroke="#2c3e50" stroke-width="2" rx="5"/>
    <text x="750" y="435" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">
      Host Operating System
    </text>

    <!-- Container Runtime -->
    <rect x="580" y="340" width="340" height="50" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="5"/>
    <text x="750" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">
      Container Runtime (Docker, containerd)
    </text>

    <!-- Container 1 -->
    <g id="container1">
      <rect x="590" y="200" width="150" height="130" fill="#ecf0f1" stroke="#00B67A" stroke-width="3" rx="5"/>
      <rect x="600" y="285" width="130" height="35" fill="#3498db" stroke="#2980b9" stroke-width="1" rx="3"/>
      <text x="665" y="297" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ffffff">
        Libraries &amp;
      </text>
      <text x="665" y="312" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ffffff">
        Dependencies
      </text>
      <rect x="600" y="215" width="130" height="60" fill="#00B67A" stroke="#00905F" stroke-width="2" rx="3"/>
      <text x="665" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">
        App A
      </text>
      <text x="665" y="265" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">
        🐳
      </text>
    </g>

    <!-- Container 2 -->
    <g id="container2">
      <rect x="760" y="200" width="150" height="130" fill="#ecf0f1" stroke="#00B67A" stroke-width="3" rx="5"/>
      <rect x="770" y="285" width="130" height="35" fill="#3498db" stroke="#2980b9" stroke-width="1" rx="3"/>
      <text x="835" y="297" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ffffff">
        Libraries &amp;
      </text>
      <text x="835" y="312" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ffffff">
        Dependencies
      </text>
      <rect x="770" y="215" width="130" height="60" fill="#00B67A" stroke="#00905F" stroke-width="2" rx="3"/>
      <text x="835" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">
        App B
      </text>
      <text x="835" y="265" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">
        🐳
      </text>
    </g>

    <!-- Container 3 -->
    <g id="container3">
      <rect x="590" y="150" width="150" height="40" fill="#ecf0f1" stroke="#00B67A" stroke-width="2" stroke-dasharray="5,5" rx="5"/>
      <text x="665" y="175" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">
        App C 🐳
      </text>
    </g>

    <!-- Container 4 -->
    <g id="container4">
      <rect x="760" y="150" width="150" height="40" fill="#ecf0f1" stroke="#00B67A" stroke-width="2" stroke-dasharray="5,5" rx="5"/>
      <text x="835" y="175" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7f8c8d">
        App D 🐳
      </text>
    </g>

    <!-- Benefits -->
    <text x="750" y="555" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#00B67A">
      ✅ Lightweight (MB) • Fast startup • Efficient • Portable
    </text>
  </g>

  <!-- Key Point -->
  <rect x="200" y="575" width="600" height="20" fill="none"/>
  <text x="500" y="590" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#2c3e50" font-style="italic">
    Containers share the host OS kernel → Much lighter than VMs with full OS
  </text>
</svg>
